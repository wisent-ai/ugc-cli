[package]
name = "ugc-cli"
version = "0.1.0"
edition = "2024"
description = "Local campaign ledger, rights receipts, and creator operations workflow"
license-file = "LICENSE"
repository = "https://github.com/wisent-ai/ugc-cli"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.4", features = ["derive"] }
dirs = "6.0.0"
hex = "0.4.3"
hmac = "0.13.0"
infer = "0.22.0"
reqwest = { version = "0.13.4", features = ["blocking", "json", "query", "rustls"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
tokio = { version = "1", features = ["net", "rt-multi-thread", "time"] }
wisent-onboarding-client = { path = ".wisent-output/dependencies/onboarding-client" }
